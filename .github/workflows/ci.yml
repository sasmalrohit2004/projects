name: EcoWear CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        working-directory: ./ecowear-frontend
        run: npm install

      - name: Build Frontend
        working-directory: ./ecowear-frontend
        run: npm run build

      - name: Install Backend Dependencies
        working-directory: ./ecowear-backend
        run: npm install

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Frontend Docker Image
        run: docker build -t sasmalrohit2004/ecowear-frontend:latest ./ecowear-frontend

      - name: Build Backend Docker Image
        run: docker build -t sasmalrohit2004/ecowear-backend:latest ./ecowear-backend

      - name: Push Frontend Image
        run: docker push sasmalrohit2004/ecowear-frontend:latest

      - name: Push Backend Image
        run: docker push sasmalrohit2004/ecowear-backend:latest